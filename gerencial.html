<title>Painel Gerencial — Agenda de Visitas</title>
<style>
  :root{
    --bg:#f5f3ee;
    --surface:#ffffff;
    --ink:#1c1c1c;
    --muted:#6b6b6b;
    --border:#e2ded3;
    --navy:#13294b;
    --navy-ink:#ffffff;
    --green:#1f7a3f;
    --green-bg:#e6f4ea;
    --pending:#8a6d1a;
    --pending-bg:#fbeece;
    --shadow:0 1px 3px rgba(0,0,0,.06);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .wrap{ max-width:980px; margin:0 auto; padding:28px 20px 60px; }
  header.top{ margin-bottom:22px; }
  header.top h1{ font-size:22px; margin:0 0 4px; color:var(--navy); }
  header.top .sub{ color:var(--muted); font-size:14px; }
  .refresh-row{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  button{
    font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); padding:8px 14px; color:var(--ink);
  }
  button:hover{ border-color:var(--navy); }
  button:disabled{ opacity:.5; cursor:default; }
  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:22px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); }
  .stat-card .label{ font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:6px; }
  .stat-card .value{ font-size:24px; font-weight:700; color:var(--navy); }
  .stat-card .sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .sup-list{ display:flex; flex-direction:column; gap:10px; }
  .sup-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
  .sup-head{ display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; }
  .sup-head .name{ font-weight:700; flex:1; min-width:0; }
  .badge{ font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .badge.ok{ background:var(--green-bg); color:var(--green); }
  .badge.pending{ background:var(--pending-bg); color:var(--pending); }
  .sup-head .pct{ font-size:13px; color:var(--muted); min-width:130px; text-align:right; }
  .sup-head .chev{ color:var(--muted); transition:transform .15s; }
  .sup-card.open .chev{ transform:rotate(90deg); }
  .sup-body{ display:none; border-top:1px solid var(--border); padding:14px 16px 18px; }
  .sup-card.open .sup-body{ display:block; }
  .week-mini{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:14px; }
  .week-mini .d{ background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px; text-align:center; }
  .week-mini .d .n{ font-size:11px; color:var(--muted); text-transform:uppercase; }
  .week-mini .d .c{ font-size:16px; font-weight:700; color:var(--navy); }
  .cdd-group{ margin-bottom:10px; }
  .cdd-group h4{ font-size:12px; text-transform:uppercase; color:var(--muted); margin:10px 0 6px; }
  .pdv-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .pdv-row:last-child{ border-bottom:none; }
  .pdv-row .info{ flex:1; min-width:0; }
  .pdv-row .loja{ font-weight:600; }
  .pdv-row .meta{ color:var(--muted); font-size:12px; }
  .pdv-row .days{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .pdv-row .day-pill{ font-size:11px; padding:2px 7px; border-radius:6px; background:var(--navy); color:var(--navy-ink); font-weight:700; }
  .pdv-row .day-pill.off{ background:transparent; color:var(--muted); border:1px dashed var(--border); }
  .empty{ color:var(--muted); font-size:13px; padding:20px 0; text-align:center; }
  .eyebrow{ color:var(--muted); font-size:13px; margin-bottom:14px; }
  .sup-actions{ border-top:1px solid var(--border); margin-top:14px; padding-top:14px; display:flex; align-items:center; gap:10px; }
  .btn-danger{ border-color:#c0392b; color:#c0392b; }
  .btn-danger:hover{ background:#fdecea; }
  .action-msg{ font-size:12px; color:var(--muted); }
</style>

<div class="wrap">
  <header class="top">
    <h1>Painel Gerencial — Agenda de Visitas</h1>
    <div class="sub" id="weekLabel">Carregando semana…</div>
    <div class="refresh-row">
      <button id="refreshBtn">Atualizar</button>
      <span class="sub" id="lastUpdated"></span>
    </div>
  </header>

  <div class="stats-row" id="statsRow"></div>
  <div class="eyebrow" id="eyebrow"></div>
  <div class="sup-list" id="supList"></div>
</div>
<iframe name="syncFrame" id="syncFrame" style="display:none"></iframe>

<script>
(function(){
  "use strict";

  var DATA_URL = "agenda_dados.csv";
  var WEEK_URL = "agenda_semana.txt";
  var SYNC_URL = "https://script.google.com/macros/s/AKfycbxSA75fpCBdSd2CyRH5TC-vOs7Vv-ujldPGcaAc0M5hltt7SKzxuMKXF7zUGfLxL-RCww/exec";
  var DETAIL_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQNc3TlNTDf3d8SiEUyYqh4TIz11z9vZHsLnqDASHgn5qB_JoZQqBnHgfJWuKv9IzWzUb581SDUu3gk/pub?gid=1646888986&single=true&output=csv";
  var STATUS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQNc3TlNTDf3d8SiEUyYqh4TIz11z9vZHsLnqDASHgn5qB_JoZQqBnHgfJWuKv9IzWzUb581SDUu3gk/pub?gid=2068477261&single=true&output=csv";

  var DAYS = [
    {code:"SEG", label:"Seg"},
    {code:"TER", label:"Ter"},
    {code:"QUA", label:"Qua"},
    {code:"QUI", label:"Qui"},
    {code:"SEX", label:"Sex"},
    {code:"SAB", label:"Sáb"}
  ];

  var rows = [];
  var WEEK_ID = "";
  var roster = {}; // { sup: { pdvs:[...], promotores:{} } }
  var statusBySup = {};
  var detailBySup = {}; // sup -> { chave: [dia,...] }

  function norm(s){ return (s||"").toString().trim(); }

  function findCol(header, names){
    for (var i=0;i<header.length;i++){
      var h = header[i].toUpperCase().replace(/﻿/g,"").trim();
      for (var j=0;j<names.length;j++){ if (h === names[j]) return i; }
    }
    return -1;
  }

  function parseCSV(text){
    var lines = text.replace(/﻿/g,"").split(/\r?\n/).filter(function(l){ return l.trim().length; });
    if (!lines.length) return [];
    var header = lines[0].split(";");
    var iPromotor = findCol(header, ["PROMOTOR"]);
    var iSupervisor = findCol(header, ["SUPERVISOR"]);
    var iCDD = findCol(header, ["CDD"]);
    var iCodPdv = findCol(header, ["COD PDV","CODPDV"]);
    var iChave = findCol(header, ["CHAVE"]);
    var iLoja = findCol(header, ["LOJA"]);
    var iEndereco = findCol(header, ["ENDEREÇO","ENDERECO"]);
    if (iEndereco === -1){
      for (var k=0;k<header.length;k++){
        if (header[k].toUpperCase().replace(/﻿/g,"").trim().indexOf("ENDERE") === 0){ iEndereco = k; break; }
      }
    }
    var iCidade = findCol(header, ["CIDADE"]);

    if (iSupervisor === -1 || iLoja === -1){ return null; }

    var out = [];
    for (var l=1; l<lines.length; l++){
      var cols = lines[l].split(";");
      var chave = iChave>-1 ? norm(cols[iChave]) : (norm(cols[iCodPdv])+"_"+l);
      var sup = norm(cols[iSupervisor]);
      var loja = norm(cols[iLoja]);
      if (!sup || !loja) continue;
      out.push({
        promotor: iPromotor>-1 ? norm(cols[iPromotor]) : "",
        supervisor: sup,
        cdd: iCDD>-1 ? norm(cols[iCDD]) : "SEM CDD",
        chave: chave || (loja+"_"+l),
        loja: loja,
        endereco: iEndereco>-1 ? norm(cols[iEndereco]) : "",
        cidade: iCidade>-1 ? norm(cols[iCidade]) : ""
      });
    }
    return out;
  }

  function parseCsvGeneric(text){
    var lines = [];
    var i=0, field="", row=[], inQuotes=false;
    text = (text||"").replace(/\r\n/g,"\n").replace(/^﻿/,"");
    while (i < text.length){
      var c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i+=2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      } else {
        if (c === '"'){ inQuotes = true; i++; continue; }
        if (c === ','){ row.push(field); field=""; i++; continue; }
        if (c === '\n'){ row.push(field); lines.push(row); row=[]; field=""; i++; continue; }
        field += c; i++; continue;
      }
    }
    if (field.length || row.length){ row.push(field); lines.push(row); }
    return lines.filter(function(r){ return r.length>1 || (r[0]||"").trim().length; });
  }

  function csvUrlWithCacheBust(url){
    return url + (url.indexOf("?")>-1 ? "&" : "?") + "_ts=" + Date.now() + Math.random().toString(36).slice(2);
  }

  function buildRoster(){
    roster = {};
    rows.forEach(function(r){
      if (!roster[r.supervisor]) roster[r.supervisor] = { pdvs: [], promotores: {} };
      roster[r.supervisor].pdvs.push(r);
      if (r.promotor) roster[r.supervisor].promotores[r.promotor] = true;
    });
  }

  function loadWeek(){
    return fetch(WEEK_URL, {cache:"no-store"}).then(function(res){
      return res.ok ? res.text() : "";
    }).then(function(text){
      WEEK_ID = (text||"").trim();
    }).catch(function(){ WEEK_ID = ""; });
  }

  function loadRoster(){
    return fetch(DATA_URL, {cache:"no-store"}).then(function(res){
      if (!res.ok) throw new Error("http "+res.status);
      return res.text();
    }).then(function(text){
      var parsed = parseCSV(text);
      if (!parsed) throw new Error("csv invalido");
      rows = parsed;
      buildRoster();
    });
  }

  function loadRemote(){
    return Promise.all([
      fetch(csvUrlWithCacheBust(DETAIL_CSV_URL), {cache:"no-store"}).then(function(r){ return r.text(); }),
      fetch(csvUrlWithCacheBust(STATUS_CSV_URL), {cache:"no-store"}).then(function(r){ return r.text(); })
    ]).then(function(results){
      var detailRows = parseCsvGeneric(results[0]);
      var statusRows = parseCsvGeneric(results[1]);

      statusBySup = {};
      if (statusRows.length){
        var sHeader = statusRows[0];
        var sIdx = {};
        sHeader.forEach(function(h,i){ sIdx[h.trim().toUpperCase()] = i; });
        for (var s=1; s<statusRows.length; s++){
          var srow = statusRows[s];
          var sup = norm(srow[sIdx["SUPERVISOR"]]);
          if (!sup) continue;
          var semana = norm(srow[sIdx["SEMANA"]]);
          if (WEEK_ID && semana !== WEEK_ID) continue;
          statusBySup[sup] = {
            semana: semana,
            gravadoEm: srow[sIdx["GRAVADO_EM"]] || "",
            totalPdvs: parseInt(srow[sIdx["TOTAL_PDVS"]], 10) || 0,
            totalAgendados: parseInt(srow[sIdx["TOTAL_AGENDADOS"]], 10) || 0
          };
        }
      }

      detailBySup = {};
      if (detailRows.length){
        var dHeader = detailRows[0];
        var dIdx = {};
        dHeader.forEach(function(h,i){ dIdx[h.trim().toUpperCase()] = i; });
        for (var d=1; d<detailRows.length; d++){
          var drow = detailRows[d];
          var dsup = norm(drow[dIdx["SUPERVISOR"]]);
          if (!dsup) continue;
          var dsemana = norm(drow[dIdx["SEMANA"]]);
          if (WEEK_ID && dsemana !== WEEK_ID) continue;
          var chave = drow[dIdx["CHAVE"]] || "";
          var dia = drow[dIdx["DIA"]] || "";
          if (!chave || !dia) continue;
          if (!detailBySup[dsup]) detailBySup[dsup] = {};
          if (!detailBySup[dsup][chave]) detailBySup[dsup][chave] = [];
          if (detailBySup[dsup][chave].indexOf(dia) === -1) detailBySup[dsup][chave].push(dia);
        }
      }
    });
  }

  function resetSupervisor(sup){
    var payload = {
      supervisor: sup,
      semana: WEEK_ID,
      totalPdvs: roster[sup] ? roster[sup].pdvs.length : 0,
      totalAgendados: 0,
      entries: []
    };
    return new Promise(function(resolve){
      var iframe = document.getElementById("syncFrame");
      var form = document.createElement("form");
      form.method = "POST";
      form.action = SYNC_URL;
      form.target = "syncFrame";
      form.style.display = "none";
      var input = document.createElement("input");
      input.type = "hidden";
      input.name = "payload";
      input.value = JSON.stringify(payload);
      form.appendChild(input);
      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
      setTimeout(function(){ resolve(true); }, 900);
    });
  }

  function formatDateTime(iso){
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    function pad(n){ return n<10 ? "0"+n : ""+n; }
    return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" às "+pad(d.getHours())+":"+pad(d.getMinutes());
  }

  function renderStats(){
    var sups = Object.keys(roster).sort();
    var totalSup = sups.length;
    var gravados = sups.filter(function(s){ return !!statusBySup[s]; }).length;

    var totalPdvsGeral = 0, totalAgendadosGeral = 0;
    sups.forEach(function(s){
      totalPdvsGeral += roster[s].pdvs.length;
      totalAgendadosGeral += (statusBySup[s] ? statusBySup[s].totalAgendados : 0);
    });

    var pctSup = totalSup ? Math.round((gravados/totalSup)*100) : 0;
    var pctPdv = totalPdvsGeral ? Math.round((totalAgendadosGeral/totalPdvsGeral)*100) : 0;

    var html = "";
    html += "<div class='stat-card'><div class='label'>Supervisores gravaram</div><div class='value'>"+gravados+"/"+totalSup+"</div><div class='sub'>"+pctSup+"% da equipe</div></div>";
    html += "<div class='stat-card'><div class='label'>Pendentes</div><div class='value'>"+(totalSup-gravados)+"</div><div class='sub'>ainda não gravaram esta semana</div></div>";
    html += "<div class='stat-card'><div class='label'>PDVs agendados</div><div class='value'>"+totalAgendadosGeral+"/"+totalPdvsGeral+"</div><div class='sub'>"+pctPdv+"% da carteira total</div></div>";
    document.getElementById("statsRow").innerHTML = html;
  }

  function dayCounts(sup){
    var counts = {};
    DAYS.forEach(function(d){ counts[d.code] = 0; });
    var det = detailBySup[sup];
    if (det){
      Object.keys(det).forEach(function(chave){
        det[chave].forEach(function(diaLabel){
          var day = DAYS.filter(function(d){ return d.label === diaLabel; })[0];
          if (day) counts[day.code]++;
        });
      });
    }
    return counts;
  }

  function renderSupBody(sup){
    var det = detailBySup[sup] || {};
    var counts = dayCounts(sup);
    var html = "<div class='week-mini'>";
    DAYS.forEach(function(d){
      html += "<div class='d'><div class='n'>"+d.label+"</div><div class='c'>"+counts[d.code]+"</div></div>";
    });
    html += "</div>";

    var pdvs = roster[sup] ? roster[sup].pdvs.slice() : [];
    var byGroup = {};
    var groupOrder = [];
    pdvs.forEach(function(p){
      if (!byGroup[p.cdd]){ byGroup[p.cdd] = []; groupOrder.push(p.cdd); }
      byGroup[p.cdd].push(p);
    });
    groupOrder.sort();

    if (!pdvs.length){
      html += "<div class='empty'>Nenhum PDV cadastrado para este supervisor na base atual.</div>";
    }

    groupOrder.forEach(function(cdd){
      html += "<div class='cdd-group'><h4>"+cdd+" · "+byGroup[cdd].length+" PDVs</h4>";
      byGroup[cdd].forEach(function(p){
        var diasMarcados = det[p.chave] || [];
        html += "<div class='pdv-row'>";
        html += "<div class='info'><div class='loja'>"+p.loja+"</div><div class='meta'>"+p.cidade+(p.promotor?" · "+p.promotor:"")+"</div></div>";
        html += "<div class='days'>";
        DAYS.forEach(function(d){
          var marcado = diasMarcados.indexOf(d.label) > -1;
          html += "<span class='day-pill"+(marcado?"":" off")+"'>"+d.label+"</span>";
        });
        html += "</div></div>";
      });
      html += "</div>";
    });

    if (statusBySup[sup]){
      html += "<div class='sup-actions'>";
      html += "<button class='btn-danger' data-reset-sup=\""+sup.replace(/"/g,"&quot;")+"\">Zerar agenda desta semana</button>";
      html += "<span class='action-msg'></span>";
      html += "</div>";
    }

    return html;
  }

  function renderList(){
    var sups = Object.keys(roster).sort();
    var html = "";
    sups.forEach(function(sup){
      var st = statusBySup[sup];
      var total = roster[sup].pdvs.length;
      var agendados = st ? st.totalAgendados : 0;
      var pct = total ? Math.round((agendados/total)*100) : 0;
      html += "<div class='sup-card' data-sup=\""+sup.replace(/"/g,"&quot;")+"\">";
      html += "<div class='sup-head'>";
      html += "<span class='badge "+(st?"ok":"pending")+"'>"+(st?"GRAVADO":"PENDENTE")+"</span>";
      html += "<span class='name'>"+sup+"</span>";
      html += "<span class='pct'>"+agendados+"/"+total+" PDVs ("+pct+"%)"+(st&&st.gravadoEm?" · "+formatDateTime(st.gravadoEm):"")+"</span>";
      html += "<span class='chev'>›</span>";
      html += "</div>";
      html += "<div class='sup-body'></div>";
      html += "</div>";
    });
    document.getElementById("supList").innerHTML = html || "<div class='empty'>Nenhum supervisor encontrado na base atual.</div>";

    document.querySelectorAll(".sup-card").forEach(function(card){
      var head = card.querySelector(".sup-head");
      head.addEventListener("click", function(){
        var isOpen = card.classList.contains("open");
        if (isOpen){
          card.classList.remove("open");
          return;
        }
        var sup = card.getAttribute("data-sup");
        card.querySelector(".sup-body").innerHTML = renderSupBody(sup);
        card.classList.add("open");
      });
    });

    document.getElementById("supList").addEventListener("click", function(e){
      var btn = e.target.closest("[data-reset-sup]");
      if (!btn) return;
      e.stopPropagation();
      var sup = btn.getAttribute("data-reset-sup");
      if (!confirm("Isso zera a agenda de "+sup+" para a semana atual, liberando pra ele refazer do zero. Não dá pra desfazer. Confirma?")) return;
      var msg = btn.parentElement.querySelector(".action-msg");
      btn.disabled = true;
      msg.textContent = "Zerando…";
      resetSupervisor(sup).then(function(){
        msg.textContent = "Zerado ✓ atualizando painel…";
        return loadAll();
      }).catch(function(){
        msg.textContent = "Falha ao zerar — tente de novo.";
        btn.disabled = false;
      });
    });
  }

  function renderAll(){
    var weekLabelEl = document.getElementById("weekLabel");
    weekLabelEl.textContent = WEEK_ID ? ("Semana publicada: "+WEEK_ID) : "Semana não identificada (agenda_semana.txt ausente)";
    renderStats();
    renderList();
    document.getElementById("lastUpdated").textContent = "Atualizado às "+formatDateTime(new Date().toISOString());
  }

  function loadAll(){
    var btn = document.getElementById("refreshBtn");
    var eyebrow = document.getElementById("eyebrow");
    btn.disabled = true;
    eyebrow.textContent = "Carregando dados…";
    return loadWeek().then(loadRoster).then(loadRemote).then(function(){
      eyebrow.textContent = "";
      renderAll();
    }).catch(function(err){
      eyebrow.textContent = "Erro ao carregar dados: "+err.message;
    }).finally(function(){
      btn.disabled = false;
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", loadAll);
  loadAll();
})();
</script>
